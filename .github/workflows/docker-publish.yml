name: Publish frontend image to Docker Hub

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: dockerhub-publish-main
  cancel-in-progress: false

env:
  IMAGE: emilxvt/mtogo-front
  SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  publish:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      inputs.source_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Confirm the verified commit is current main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$SOURCE_SHA" == "$main_sha" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Commit superseded on main; no image will be published."
          fi

      - name: Checkout verified commit
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Docker Buildx
        if: steps.gate.outputs.ready == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Sign in to Docker Hub
        if: steps.gate.outputs.ready == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish verified image
        if: steps.gate.outputs.ready == 'true'
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=frontend
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Promote current main to latest
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$SOURCE_SHA" == "$main_sha" ]]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          fi
